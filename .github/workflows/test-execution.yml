name: Automation Regression Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Target Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
		  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Automation Tests
        run: mvn clean test -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} -Dheadless=true
        continue-on-error: true

      - name: Upload Extent Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Extent-Report
          path: test-output/ExtentReports/extentReport.html
          retention-days: 14

      - name: Send Email Notification with Report
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Execution Status: ${{ job.status }} - TutorialsNinja Suite"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions Automation <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Automation execution completed on Java 25.
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          attachments: test-output/ExtentReports/extentReport.html